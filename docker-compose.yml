# Berlin Houseware — self-hosted Hydrogen (Node) behind the host nginx.
# Publishes to 127.0.0.1:3001 ONLY (localhost); host nginx terminates TLS and
# proxies to it. Unique Compose project + network so it can't clash with the
# other sites on this box (netx-hub / mercur-infra).
name: berlin-houseware

services:
  web:
    build: .
    env_file: .env
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"   # localhost only
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [berlin-net]

networks:
  berlin-net:
    name: berlin-houseware-net
