stages:
  - test
  - deploy

test:
  stage: test
  tags: [berlin-vps]
  script:
    - >
      docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp
      -v "$CI_PROJECT_DIR":/app -w /app node:22-bookworm-slim
      sh -c "npm ci && npm run typecheck && npm run build"

deploy:
  stage: deploy
  tags: [berlin-vps]
  resource_group: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd /opt/berlin/src
    - PREV_IMG=$(docker compose images -q web || true)
    - git fetch --all --prune
    - git reset --hard origin/main
    - docker compose build
    - docker compose up -d
    - |
      ok=0
      for i in $(seq 1 15); do
        if curl -fsS http://127.0.0.1:3001/ >/dev/null; then ok=1; break; fi
        sleep 2
      done
      if [ "$ok" != "1" ]; then
        echo "Healthcheck FAILED — rolling back to previous image"
        if [ -n "$PREV_IMG" ]; then
          docker tag "$PREV_IMG" berlin-houseware-web:latest
          docker compose up -d
        fi
        exit 1
      fi
    - echo "Deploy OK"
  environment:
    name: production
    url: https://berlinhousewares.com